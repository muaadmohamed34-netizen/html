<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>

<h1>Delivery driver form</h1>
<fieldset>
    <legend>Driver Information</legend>
    <form action="/practice.html">
        <label for="name">Name:</label>
        <input type="text" name="first name" placeholder="Enter your name">
        <label for="dob">Date of Birth:</label>
        
        <input type="date" name="dob" placeholder="Enter your date of birth">
        <label for="address">Address:</label> >
        <input type="text" name="address" placeholder="Enter your address">
        <label for="phone">Phone Number:</label>
        <input type="tel" name="phone" placeholder="Enter your phone number">
        <label for="email">Email:</label>
        <input type="email" name="email" placeholder="Enter your email">
    
    </form>
</fieldset>

<fieldset>
<form action="practice.html" method="post">
    <label for="license">Driver's License Number:</label>
    <input type="text" name="license" placeholder="Enter your driver's license number">
    <label for="insurance">Insurance Provider:</label>
    <input type="text" name="insurance" placeholder="Enter your insurance provider">
    <label for="license_expiration">License Expiration Date:</label>
    <input type="date" name="license_expiration" placeholder="Enter your license expiration date">
    <label for="points"> Points on License: </label>
    <input type="number" name="points" placeholder="Enter number of years of points on license">

</form>

<br>

</fieldset>
    <form action="practice.html" method="post">
        <label for="saving">aggree:</label>
        <input type="checkbox" name="saving" value="yes">
        <label for="submit">submit:</label>
        <input type="submit" value="Submit">
        <label for="reset">reset:</label>
        <input type="reset" value="Reset">
    </form>

</body>
</html>
